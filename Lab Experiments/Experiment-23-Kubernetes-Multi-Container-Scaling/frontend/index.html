<!DOCTYPE html>
<html>
<head><title>Student List</title></head>
<body style="font-family:Arial;margin:40px">
  <h2>Student List</h2>
  <ul id="list"></ul>
  <script>
    fetch('/api/students')
      .then(r => r.json())
      .then(d => d.forEach(s => {
        document.getElementById('list').innerHTML += `<li>${s.id} - ${s.name} (${s.dept})</li>`;
      }));
  </script>
</body>
</html>
